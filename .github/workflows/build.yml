name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project files
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/install-packages.sh
          test -f app/src/main/assets/start-vnc.sh

      - name: Build debug APK
        run: gradle clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaliVNC-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          TAG="v${VERSION}"
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)"
          echo "Creating release ${TAG}"
          gh release create "${TAG}" "${APK}"             --repo "${GITHUB_REPOSITORY}"             --title "Kali VNC ${TAG}"             --notes "Build automatique de Kali VNC ${TAG}. APK debug pour test et installation."
