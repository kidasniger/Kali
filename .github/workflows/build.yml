name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch Android PRoot engine
        run: bash scripts/fetch-proroot.sh

      - name: Verify sources and native runtime
        run: |
          set -e
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/kalivnc/app/Config.kt
          grep -q 'PROROOT_ENGINE_VERSION = "1.2.8"' app/src/main/java/com/kalivnc/app/Config.kt
          grep -q 'PROROOT_LIBRARY = "libproroot.so"' app/src/main/java/com/kalivnc/app/Config.kt
          grep -q 'versionCode = 8' app/build.gradle.kts
          grep -q 'versionName = "1.5"' app/build.gradle.kts
          test -f app/src/main/assets/install-packages.sh
          test -f app/src/main/assets/start-vnc.sh
          test -f scripts/fetch-proroot.sh
          bash -n scripts/fetch-proroot.sh
          find app/src/main/jniLibs/arm64-v8a -maxdepth 1 -type f -print | sort

      - name: Verify checked-out commit
        run: |
          set -e
          echo "HEAD=$(git rev-parse HEAD)"
          git status --short
          git show HEAD:app/src/main/java/com/kalivnc/app/Config.kt | grep 'PROROOT_ENGINE_VERSION = "1.2.8"'
          grep 'PROROOT_ENGINE_VERSION = "1.2.8"' app/src/main/java/com/kalivnc/app/Config.kt

      - name: Clean workspace
        run: |
          rm -rf .gradle app/build

      - name: Build debug APK
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-clean
        run: |
          rm -rf "$GRADLE_USER_HOME"
          mkdir -p "$GRADLE_USER_HOME"
          gradle --no-daemon --no-build-cache -Pkotlin.incremental=false clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)
          test -n "$APK"
          ls -lh "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libproroot(-runtime|-linker|-bridge|-stub-loader)?\.so' | sort

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaliVNC-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v1.5
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating APK asset."
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Creating release $TAG."
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Kali VNC $TAG" \
              --notes "Kali VNC $TAG. Moteur Android proroot 1.2.8 intégré et vérifié."
          fi