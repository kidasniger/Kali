name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch Android PRoot engine
        run: bash scripts/fetch-proroot.sh

      - name: Verify project files
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/install-packages.sh
          test -f app/src/main/assets/start-vnc.sh
          test -f scripts/fetch-proroot.sh
          bash -n scripts/fetch-proroot.sh

      - name: Build debug APK
        run: gradle clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)
          test -n "$APK"
          ls -lh "$APK"
          file "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libproroot(-runtime|-linker|-bridge|-stub-loader)?\.so' | sort

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaliVNC-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          TAG=v${VERSION}
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kali VNC $TAG" \
            --notes "Kali VNC $TAG. Moteur Android proroot 1.2.8 intégré et vérifié."