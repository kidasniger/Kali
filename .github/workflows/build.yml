name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build patched Android PRoot backend
        run: bash scripts/fetch-proroot.sh

      - name: Verify sources and backend
        run: |
          set -e
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          grep -q 'versionCode = 15' app/build.gradle.kts
          grep -q 'versionName = "2.2"' app/build.gradle.kts
          grep -q 'PROOT_LOADER' app/src/main/java/com/kalivnc/app/ProotRunner.kt
          grep -q 'PROOT_NO_SECCOMP' app/src/main/java/com/kalivnc/app/ProotRunner.kt
          grep -q 'PROOT_TMP_DIR' app/src/main/java/com/kalivnc/app/ProotRunner.kt
          grep -q 'Raw' app/src/main/java/com/kalivnc/app/RfbClient.kt
          ! grep -q 'ExtendedDesktopSize' app/src/main/java/com/kalivnc/app/RfbClient.kt
                    test -f app/src/main/assets/install-packages.sh
          test -f app/src/main/assets/start-vnc.sh
          test -f app/src/main/jniLibs/arm64-v8a/libproot.so
          test -f app/src/main/jniLibs/arm64-v8a/libproot-loader.so
          test ! -e app/src/main/jniLibs/arm64-v8a/libproroot-runtime.so
          test ! -e app/src/main/jniLibs/arm64-v8a/libproroot-linker.so
          test ! -e app/src/main/jniLibs/arm64-v8a/libproroot-bridge.so
          test ! -e app/src/main/jniLibs/arm64-v8a/libproroot-stub-loader.so
          bash -n scripts/fetch-proroot.sh

      - name: Clean workspace
        run: rm -rf .gradle app/build

      - name: Build debug APK
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-clean
        run: |
          rm -rf "$GRADLE_USER_HOME"
          mkdir -p "$GRADLE_USER_HOME"
          gradle --no-daemon --no-build-cache -Pkotlin.incremental=false clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)
          test -n "$APK"
          ls -lh "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libproot(-loader)?\.so' | sort
          if unzip -l "$APK" | grep -E 'lib/arm64-v8a/libproroot(-runtime|-linker|-bridge|-stub-loader)?\.so'; then
            echo "ERROR: legacy proroot 1.2.8 libraries remain in APK"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaliVNC-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v2.2
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n1)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Kali VNC $TAG" \
              --notes "Kali VNC $TAG : suppression de la boucle ExtendedDesktopSize/DesktopSize et passage à Raw + mises à jour RFB incrémentales."
          fi
